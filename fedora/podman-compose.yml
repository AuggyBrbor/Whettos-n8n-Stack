# A revised and validated compose file for a scalable n8n, PostgreSQL, Redis, and Ollama stack.
# Optimized for use with podman-compose on a Fedora 42 system.
version: '3.8'

networks:
  # A dedicated network for the stack improves security and isolation.
  n8n-stack:
    driver: bridge

services:
  # The PostgreSQL database service for n8n data persistence.
  postgres:
    image: docker.io/postgres:16
    container_name: n8n-postgres
    hostname: postgres
    networks:
      - n8n-stack
    environment:
      # Load sensitive values from a .env file for better security.
      - POSTGRES_USER=${POSTGRES_USER:-n8n}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?err} # Must be set in .env file. The :?err makes this variable required.
      - POSTGRES_DB=${POSTGRES_DB:-n8n}
      - POSTGRES_MAX_CONNECTIONS=150
    volumes:
      # The ':z' is crucial for SELinux on Fedora to allow container access.
      - n8n-postgres-data:/var/lib/postgresql/data:z
    restart: unless-stopped
    healthcheck:
      # $$ is used to escape the $ for variable expansion within the container's shell.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-n8n} -d $${POSTGRES_DB:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis service for managing the workflow execution queue and caching.
  redis:
    image: docker.io/redis:7-alpine
    container_name: n8n-redis
    hostname: redis
    networks:
      - n8n-stack
    volumes:
      - n8n-redis-data:/data:z # SELinux fix
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The main n8n service: handles UI, API, and queues jobs.
  n8n-main:
    image: docker.io/n8nio/n8n:latest # Pinning to latest for bug fixes and security.
    container_name: n8n-main
    hostname: n8n-main
    networks:
      - n8n-stack
    user: "1000:1000"
    ports:
      # Binds the port only to the host's loopback interface for security.
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=http://n8n-main:5678/api/v1
      - WEBHOOK_URL=http://n8n-main:5678
      - N8N_AUTH_EXCLUDE_ENDPOINTS=api
      - EXECUTIONS_MODE=queue
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:?err} # Use .env file
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-n8n}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-n8n}
      - DB_POSTGRESDB_POOL_SIZE=3
      - QUEUE_BULL_REDIS_HOST=redis
      - CACHE_ENABLE=true
      - CACHE_TYPE=redis
      - CACHE_REDIS_HOST=redis
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-America/Denver}
      - N8N_LOG_LEVEL=info
      - N8N_METRICS_ENABLED=true
      - N8N_METRICS=true
      - N8N_ENCRYPTION_KEY=${N8N_E_KEY:?err}
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_RUNNERS_ENABLED=true
      - OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS=true
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=84
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_LOG_FORMAT=text
      - N8N_SECURITY_AUDIT_DAYS_ABANDONED_WORKFLOW=365
      - N8N_HIRING_BANNER_ENABLED=false
      - N8N_METRICS_INCLUDE_WORKFLOW_ID_LABEL=true
      - WORKFLOWS_DEFAULT_NAME=ausOz
      - EXECUTIONS_TIMEOUT=3600
      - N8N_WORKFLOW_CALLER_POLICY_DEFAULT_OPTION=any
      - N8N_REINSTALL_MISSING_PACKAGES=true
      - N8N_ONBOARDING_FLOW_DISABLED=true
      - CODE_ENABLE_STDOUT=true
      - N8N_UNVERIFIED_PACKAGES_ENABLED=true
      - NODE_FUNCTION_ALLOW_BUILTIN=true
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    volumes:
      - n8n-data:/home/node/.n8n:z # SELinux fix
    restart: unless-stopped
    depends_on:
      postgres: 
        condition: service_healthy
      redis: 
        condition: service_healthy

  n8n-worker:
    image: docker.io/n8nio/n8n:latest # Match the main service version.
    command: worker
    networks:
      - n8n-stack
    user: "1000:1000"
    environment:
      - N8N_HOST=http://n8n-main:5678/api/v1
      - N8N_AUTH_EXCLUDE_ENDPOINTS=api
      - EXECUTIONS_MODE=queue
      - EXECUTIONS_PROCESS=worker
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:?err} # Set in .env file.
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-n8n}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-n8n}
      - DB_POSTGRESDB_POOL_SIZE=3
      - QUEUE_BULL_REDIS_HOST=redis
      - CACHE_ENABLE=true
      - CACHE_TYPE=redis
      - CACHE_REDIS_HOST=redis
      - CONCURRENCY=${CONCURRENCY:-5}
      - WEBHOOK_URL=http://n8n-main:5678
      - N8N_ENCRYPTION_KEY=${N8N_E_KEY:?err}
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_RUNNERS_ENABLED=true
      - OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS=true
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=84
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_LOG_FORMAT=text
      - N8N_SECURITY_AUDIT_DAYS_ABANDONED_WORKFLOW=365
      - N8N_HIRING_BANNER_ENABLED=false
      - N8N_METRICS_INCLUDE_WORKFLOW_ID_LABEL=true
      - N8N_METRICS_ENABLED=true
      - N8N_METRICS=true
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-America/Denver}
      - WORKFLOWS_DEFAULT_NAME=ausOz
      - EXECUTIONS_TIMEOUT=3600
      - N8N_WORKFLOW_CALLER_POLICY_DEFAULT_OPTION=any
      - N8N_REINSTALL_MISSING_PACKAGES=true
      - N8N_ONBOARDING_FLOW_DISABLED=true
      - CODE_ENABLE_STDOUT=true
      - N8N_UNVERIFIED_PACKAGES_ENABLED=true
      - NODE_FUNCTION_ALLOW_BUILTIN=true
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    volumes:
      - n8n-data:/home/node/.n8n:z # SELinux fix
    restart: unless-stopped
    depends_on:
      n8n-main: 
        condition: service_started

  # The Ollama service for running local Language Models.
  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: ollama-service
    hostname: ollama
    networks:
      - n8n-stack
    ports:
      - "127.0.0.1:11434:11434" # Bind to localhost.
    volumes:
      - ollama-data:/root/.ollama:z # SELinux fix
    # devices:
    #   - /dev/kfd
    #   - /dev/dri
    restart: unless-stopped

  ollama-setup:
    image: docker.io/alpine/curl:latest
    container_name: ollama-setup
    networks:
      - n8n-stack
    environment:
      - OLLAMA_DEFAULT_MODEL=${OLLAMA_DEFAULT_MODEL:?err}
    command: >
      sh -c "
        echo 'Waiting for Ollama to be available...'
        until curl -s -f http://ollama:11434/api/tags > /dev/null; do
          sleep 5
        done
        echo 'Ollama is up. Checking if model $${OLLAMA_DEFAULT_MODEL} exists...'
        if ! curl -s http://ollama:11434/api/tags | grep -q $${OLLAMA_DEFAULT_MODEL}; then
          echo 'Model not found. Pulling $${OLLAMA_DEFAULT_MODEL}...'
          curl http://ollama:11434/api/pull -d \"{ \\\"name\\\": \\\"$${OLLAMA_DEFAULT_MODEL}\\\" }\"
          echo 'Model pull complete.'
        else
          echo 'Model $${OLLAMA_DEFAULT_MODEL} already exists.'
        fi
      "
    depends_on:
      - ollama

  n8n-mcp:
    image: ghcr.io/czlonkowski/n8n-mcp:latest
    container_name: n8n-mcp
    hostname: n8n-mcp
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - n8n-stack
    environment:
      - OLLAMA_API_BASE_URL=http://ollama:11434
      - N8N_MCP_DEFAULT_MODEL=${OLLAMA_DEFAULT_MODEL:?err}
      - N8N_API_KEY=${N8N_API_KEY}
      - N8N_API_URL=http://n8n-main:5678/api/v1
      - MCP_MODE=http
      - N8N_MODE=true
      - MCP_AUTH_TOKEN=test-token-minimum-32-chars-long
      - AUTH_TOKEN=test-token-minimum-32-chars-long
      - LOG_LEVEL=info
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_started
      n8n-main:
        condition: service_started

# Top-level 'volumes' declaration for all persistent data.
volumes:
  n8n-data:
  n8n-postgres-data:
  n8n-redis-data:
  ollama-data:
