# A revised and validated compose file for a scalable n8n, PostgreSQL, Redis, and Ollama stack.
# Optimized for use with podman-compose on a Windows 11 system.
# This version includes Nginx Proxy Manager for reverse proxying and Watchtower for automatic updates.
version: '4.2a'

networks:
  # A dedicated network for the stack improves security and isolation.
  n8n-stack:
    driver: bridge

services:
  # The PostgreSQL database service for n8n data persistence.
  postgres:
    image: docker.io/postgres:16
    container_name: n8n-${POSTGRES_HOST:-postgres}
    hostname: postgres
    networks:
      - n8n-stack
    environment:
      # Load sensitive values from a .env file for better security.
      - POSTGRES_USER=${POSTGRES_USER:-n8n}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?err} # Required: Set in .env
      - POSTGRES_DB=${POSTGRES_DB:-n8n}
      - POSTGRES_MAX_CONNECTIONS=150
    volumes:
      - n8n-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      # $$ is used to escape the $ for variable expansion.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-n8n} -d $${POSTGRES_DB:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 5

  clientData:
    image: pgvector/pgvector:pg16
    container_name: clientData
    hostname: clientData
    networks:
      - n8n-stack
    environment:
      # Load sensitive values from a .env file for better security.
      - POSTGRES_USER=${POSTGRES_USER:-n8n}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?err} # Required: Set in .env
      - POSTGRES_DB=${POSTGRES_DB:-n8n}
      - POSTGRES_MAX_CONNECTIONS=150
    volumes:
      - client-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      # $$ is used to escape the $ for variable expansion.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-n8n} -d $${POSTGRES_DB:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis service for managing the workflow execution queue and caching.
  redis:
    image: docker.io/redis:7-alpine
    container_name: n8n-redis
    hostname: redis
    networks:
      - n8n-stack
    volumes:
      - n8n-redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The main n8n service: handles UI, API, and queues jobs.
  n8n-main:
    image: docker.io/n8nio/n8n:latest
    container_name: n8n-main
    hostname: n8n-main
    networks:
      - n8n-stack
    user: "1000:1000"
    ports:
      # Binds the port only to the host's loopback interface for security.
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=http://n8n-main:5678/api/v1
      - WEBHOOK_URL=http://127.0.0.1:5678
      - N8N_AUTH_EXCLUDE_ENDPOINTS=api
      - N8N_GIT_NODE_DISABLE_BARE_REPOS=true
      - NODE_ENV=production
      # For PostgreSQL with redis and workers
      - EXECUTIONS_MODE=queue
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:?err}
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-n8n}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-n8n}
      - DB_POSTGRESDB_POOL_SIZE=3
      - QUEUE_BULL_REDIS_HOST=redis
      - CACHE_ENABLE=true
      - CACHE_TYPE=redis
      - CACHE_REDIS_HOST=redis
      - OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS=true
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-America/Denver}
      - N8N_RUNNERS_ENABLED=true
      - N8N_LOG_LEVEL=info
      - N8N_METRICS_ENABLED=true
      - N8N_METRICS=true
      - N8N_ENCRYPTION_KEY=${N8N_E_KEY:?err}
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=84
      - N8N_DIAGNOSTICS_ENABLED=false
      #- N8N_HIDE_USAGE_PAGE=true
      - N8N_LOG_FORMAT=text
      - N8N_SECURITY_AUDIT_DAYS_ABANDONED_WORKFLOW=365
      - N8N_HIRING_BANNER_ENABLED=false
      - N8N_METRICS_INCLUDE_WORKFLOW_ID_LABEL=true
      - WORKFLOWS_DEFAULT_NAME=ausOz
      - EXECUTIONS_TIMEOUT=3600
      - N8N_WORKFLOW_CALLER_POLICY_DEFAULT_OPTION=any
      - N8N_REINSTALL_MISSING_PACKAGES=true
      - N8N_ONBOARDING_FLOW_DISABLED=true
      - CODE_ENABLE_STDOUT=true
      - N8N_UNVERIFIED_PACKAGES_ENABLED=true
      - NODE_FUNCTION_ALLOW_BUILTIN=true
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_SECURE_COOKIE=false
      - N8N_PROTOCOL=http
    volumes:
      - n8n-data:/home/node/.n8n
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # n8n worker service: executes the workflows. Can be scaled for more concurrency.
  n8n-worker:
    image: docker.io/n8nio/n8n:latest
    command: worker
    networks:
      - n8n-stack
    user: "1000:1000"
    environment:
      - N8N_HOST=http://n8n-main:5678/api/v1
      - WEBHOOK_URL=http://n8n-main:5678
      - NODE_ENV=production
      - N8N_AUTH_EXCLUDE_ENDPOINTS=api
      - EXECUTIONS_MODE=queue
      - N8N_GIT_NODE_DISABLE_BARE_REPOS=true
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:?err}
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-n8n}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-n8n}
      - DB_POSTGRESDB_POOL_SIZE=3
      - QUEUE_BULL_REDIS_HOST=redis
      - CACHE_ENABLE=true
      - CACHE_TYPE=redis
      - CACHE_REDIS_HOST=redis
      - CONCURRENCY=${CONCURRENCY:-5}
      - N8N_ENCRYPTION_KEY=${N8N_E_KEY:?err}
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_RUNNERS_ENABLED=true
      - OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS=true
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=84
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_LOG_FORMAT=text
      - N8N_SECURITY_AUDIT_DAYS_ABANDONED_WORKFLOW=365
      - N8N_HIRING_BANNER_ENABLED=false
      - N8N_METRICS_INCLUDE_WORKFLOW_ID_LABEL=true
      - N8N_METRICS_ENABLED=true
      - N8N_METRICS=true
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-America/Denver}
      - WORKFLOWS_DEFAULT_NAME=ausOz
      - EXECUTIONS_TIMEOUT=3600
      - N8N_WORKFLOW_CALLER_POLICY_DEFAULT_OPTION=any
      - N8N_REINSTALL_MISSING_PACKAGES=true
      - N8N_ONBOARDING_FLOW_DISABLED=true
      - CODE_ENABLE_STDOUT=true
      - N8N_UNVERIFIED_PACKAGES_ENABLED=true
      - NODE_FUNCTION_ALLOW_BUILTIN=true
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_SECURE_COOKIE=false
      - N8N_PROTOCOL=http
    volumes:
      - n8n-data:/home/node/.n8n
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    depends_on:
      n8n-main:
        condition: service_started

