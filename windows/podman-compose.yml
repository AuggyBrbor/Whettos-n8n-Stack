  n8n-mcp:
    image: ghcr.io/czlonkowski/n8n-mcp:latest
    container_name: n8n-mcp
    hostname: n8n-mcp
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - n8n-stack
    environment:
      - N8N_API_KEY=${N8N_API_KEY:?err} # Required: Set in .env
      - N8N_API_URL=http://n8n-main:5678/api/v1
      - MCP_MODE=http
      - N8N_MODE=true
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN:?err} # Required: Set in .env
      - AUTH_TOKEN=${MCP_AUTH_TOKEN:?err} # Required: Set in .env
      - LOG_LEVEL=info
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    depends_on:
      n8n-main:
        condition: service_started

  # Nginx Proxy Manager for reverse proxying services.
  proxy:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    networks:
      - n8n-stack
    environment:
      - DB_MYSQL_HOST=proxy_db
      - DB_MYSQL_USER=npm
      - DB_MYSQL_PASSWORD=${NPM_DB_PASSWORD:?err} # Required: Set in .env
      - DB_MYSQL_NAME=npm
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt:z
    depends_on:
      proxy_db:
        condition: service_healthy # Waits for the DB to be ready

  # MariaDB database for Nginx Proxy Manager.
  proxy_db:
    image: jc21/mariadb-aria:latest
    container_name: npm-mariadb
    restart: unless-stopped
    networks:
      - n8n-stack
    environment:
      - MYSQL_ROOT_PASSWORD=${NPM_DB_ROOT_PASSWORD:?err} # Required: Set in .env
      - MYSQL_DATABASE=npm
      - MYSQL_USER=npm
      - MYSQL_PASSWORD=${NPM_DB_PASSWORD:?err} # Required: Set in .env
    volumes:
      - npm_db_data:/var/lib/mysql
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    healthcheck:
      # This check ensures the DB is ready before other services connect.
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Watchtower for automatically updating running containers.
  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    networks:
      - n8n-stack
    environment:
      # Sets the timezone for correct log timestamps. Inherits from .env file.
      - TZ=${GENERIC_TIMEZONE:-America/Denver}
      # Poll for new images every 24 hours (86400 seconds).
      - WATCHTOWER_POLL_INTERVAL=86400
      # Removes old images after a successful update.
      - WATCHTOWER_CLEANUP=true
      # Disables the initial notification message on startup.
      - WATCHTOWER_NO_STARTUP_MESSAGE=true
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      # Mount the podman socket to allow Watchtower to manage containers.
      - /var/run/docker.sock:/var/run/docker.sock
  pdf-merger:
    build: ./pdf-merger
    container_name: pdf-merger
    restart: unless-stopped
    user: "1000:1000"
    volumes:
      - ./RouteSheets:/data:rw
    depends_on:
      - gotenberg
  gotenberg:
    restart: unless-stopped
    container_name: pdfHandler
    image: gotenberg/gotenberg:8
  

# Top-level 'volumes' declaration for all persistent data.
volumes:
  n8n-data:
  n8n-postgres-data:
  client-postgres-data:
  n8n-redis-data:
  # # Volumes for ollama
  # ollama-data:
  # ollama-webui:
  # Volumes for Nginx Proxy Manager
  npm_data:
  npm_letsencrypt:
  npm_db_data:
